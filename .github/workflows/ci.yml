name: CI

# Gates per AGENTS.md §5: `npm run lint` and `npx tsc --noEmit` must pass;
# the production build catches what typecheck cannot (asset/font wiring,
# route compilation). The previous Deno workflow was removed in 7e66f19 —
# this is its npm-based replacement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: lint · typecheck · build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Route/layout types (LayoutProps, route params) are generated by Next
      # into .next/types; a fresh checkout has none, so typecheck must generate
      # them first. Verified: rm -rf .next && npx tsc --noEmit fails without this.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
